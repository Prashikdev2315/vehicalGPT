services:
  vehiclegpt:
    build: .
    image: vehiclegpt:latest
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    network_mode: "none"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - ./models:/app/models:ro
    command: >
      sh -c "python -m pytest tests/ -m \"not slow\" -v --tb=short &&
             python scripts/measure_runtime_profile.py --require-cgroup"
